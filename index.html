<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hangar clocks</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0F172A;
    --panel: #152036;
    --tile: #1E293B;
    --muted: #94A3B8;
    --accent: #38BDF8;
    --text: #F8FAFC;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: "Roboto", "Segoe UI", Arial, sans-serif;
    overflow: hidden;
  }
  .wrap {
    height: 100%;
    display: flex;
    flex-direction: column;
    gap: 3vh;
  }
  .clock {
    flex: 1;
    min-height: 0;
    background: var(--panel);
    border-radius: 10px;
    padding: 3vh 5vw;
    display: flex;
    flex-direction: column;
    gap: 1.5vh;
  }
  .city {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    font-size: min(7.5vw, 3.6vh);
    font-weight: 500;
    color: var(--muted);
  }
  .city .offset {
    color: var(--accent);
    font-weight: 500;
    font-variant-numeric: tabular-nums;
  }
  .face {
    flex: 1;
    min-height: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .face svg { width: 100%; height: 100%; }
  .foot {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    font-size: min(7.5vw, 3.6vh);
    color: var(--muted);
  }
  .foot .digital {
    color: var(--text);
    font-weight: 500;
    font-variant-numeric: tabular-nums;
  }
  body.no-digital .digital { display: none; }
</style>
</head>
<body>
<div class="wrap">
  <section class="clock" id="local"></section>
  <section class="clock" id="hq"></section>
</div>

<script>
  // Defaults: local = Kuala Lumpur, HQ = Singapore.
  // Change the HQ per room with the link, for example:
  //   .../?hq=Asia/Kolkata&hqname=New%20Delhi
  // Hide the small digital time with:  &digital=off
  // Show 24-hour time ("13:05 hrs") instead of AM/PM with:  &format=24
  var q = new URLSearchParams(location.search);
  if (q.get("digital") === "off") document.body.classList.add("no-digital");

  var zones = [
    { id: "local", tz: q.get("local") || "Asia/Kuala_Lumpur", name: q.get("localname") || "Kuala Lumpur" },
    { id: "hq",    tz: q.get("hq")    || "Asia/Singapore",    name: q.get("hqname")    || "Singapore" }
  ];

  var NS = "http://www.w3.org/2000/svg";
  // Digital time format: AM/PM by default. Use &format=24 for "HH:MM hrs".
  var use24 = q.get("format") === "24";

  function svgEl(name, attrs) {
    var el = document.createElementNS(NS, name);
    for (var k in attrs) el.setAttribute(k, attrs[k]);
    return el;
  }

  function buildFace() {
    var svg = svgEl("svg", { viewBox: "-100 -100 200 200", preserveAspectRatio: "xMidYMid meet" });
    svg.appendChild(svgEl("circle", { r: 96, fill: "#1E293B", stroke: "#38BDF8", "stroke-width": 3 }));

    for (var i = 0; i < 60; i++) {
      var major = i % 5 === 0;
      var quarter = i % 15 === 0;
      var r1 = 90;
      var r2 = quarter ? 76 : (major ? 80 : 85);
      var a = i * 6 * Math.PI / 180;
      svg.appendChild(svgEl("line", {
        x1: Math.sin(a) * r1, y1: -Math.cos(a) * r1,
        x2: Math.sin(a) * r2, y2: -Math.cos(a) * r2,
        stroke: "#94A3B8",
        "stroke-width": quarter ? 3 : (major ? 2.4 : 1),
        "stroke-linecap": "round"
      }));
    }

    [["12", 0, -60], ["3", 60, 0], ["6", 0, 60], ["9", -60, 0]].forEach(function (n) {
      var t = svgEl("text", {
        x: n[1], y: n[2], fill: "#F8FAFC", "font-size": 18, "font-weight": 500,
        "text-anchor": "middle", "dominant-baseline": "central",
        "font-family": "Roboto, Segoe UI, Arial, sans-serif"
      });
      t.textContent = n[0];
      svg.appendChild(t);
    });

    var hour = svgEl("line", { x1: 0, y1: 8,  x2: 0, y2: -44, stroke: "#F8FAFC", "stroke-width": 6,   "stroke-linecap": "round" });
    var min  = svgEl("line", { x1: 0, y1: 10, x2: 0, y2: -66, stroke: "#F8FAFC", "stroke-width": 4,   "stroke-linecap": "round" });
    var sec  = svgEl("line", { x1: 0, y1: 16, x2: 0, y2: -76, stroke: "#38BDF8", "stroke-width": 1.8, "stroke-linecap": "round" });
    sec.style.transformOrigin = "0px 0px";
    svg.appendChild(hour);
    svg.appendChild(min);
    svg.appendChild(sec);
    svg.appendChild(svgEl("circle", { r: 4.5, fill: "#38BDF8" }));
    svg.appendChild(svgEl("circle", { r: 1.8, fill: "#0F172A" }));

    return { svg: svg, hour: hour, min: min, sec: sec };
  }

  zones.forEach(function (z) {
    var root = document.getElementById(z.id);

    var city = document.createElement("div");
    city.className = "city";
    var nameEl = document.createElement("span");
    nameEl.textContent = z.name;
    z.offsetEl = document.createElement("span");
    z.offsetEl.className = "offset";
    city.appendChild(nameEl);
    city.appendChild(z.offsetEl);

    var face = document.createElement("div");
    face.className = "face";
    z.hands = buildFace();
    face.appendChild(z.hands.svg);

    var foot = document.createElement("div");
    foot.className = "foot";
    z.dateEl = document.createElement("span");
    z.digitalEl = document.createElement("span");
    z.digitalEl.className = "digital";
    foot.appendChild(z.dateEl);
    foot.appendChild(z.digitalEl);

    root.appendChild(city);
    root.appendChild(face);
    root.appendChild(foot);

    try {
      z.partsFmt = new Intl.DateTimeFormat("en-GB", {
        timeZone: z.tz, hour: "2-digit", minute: "2-digit", second: "2-digit", hourCycle: "h23"
      });
      z.dateFmt = new Intl.DateTimeFormat("en-GB", {
        timeZone: z.tz, weekday: "short", day: "numeric", month: "short"
      });
      z.offsetFmt = new Intl.DateTimeFormat("en-GB", {
        timeZone: z.tz, timeZoneName: "shortOffset"
      });
    } catch (e) {
      nameEl.textContent = z.name + " (unknown time zone)";
    }
  });

  function tick() {
    var now = new Date();
    var ms = now.getMilliseconds();
    zones.forEach(function (z) {
      if (!z.partsFmt) return;
      var p = z.partsFmt.format(now).split(":");
      var h = parseInt(p[0], 10), m = parseInt(p[1], 10), s = parseInt(p[2], 10);
      if (z.lastS === undefined) { z.rev = 0; }
      else if (s < z.lastS) { z.rev++; }
      z.lastS = s;
      var secAngle = s * 6 + z.rev * 360;
      var minAngle = (m + s / 60) * 6;
      var hourAngle = ((h % 12) + m / 60) * 30;
      if (z.lastSecAngle !== secAngle) {
        z.hands.sec.style.transform = "rotate(" + secAngle + "deg)";
        z.lastSecAngle = secAngle;
      }
      z.hands.min.setAttribute("transform", "rotate(" + minAngle + ")");
      z.hands.hour.setAttribute("transform", "rotate(" + hourAngle + ")");
      z.dateEl.textContent = z.dateFmt.format(now).replace(",", "");
      if (use24) {
        z.digitalEl.textContent = p[0] + ":" + p[1] + " hrs";
      } else {
        z.digitalEl.textContent = ((h % 12) || 12) + ":" + p[1] + " " + (h < 12 ? "AM" : "PM");
      }
      if (z.offsetFmt) {
        var parts = z.offsetFmt.formatToParts(now);
        for (var i = 0; i < parts.length; i++) {
          if (parts[i].type === "timeZoneName") {
            z.offsetEl.textContent = parts[i].value.replace("GMT", "GMT ");
            break;
          }
        }
      }
    });
  }
  tick();
  setInterval(tick, 100);
</script>
</body>
</html>
